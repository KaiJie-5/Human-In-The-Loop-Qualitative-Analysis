[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-qualitative-analysis"
version = "0.1.0"
description = "Local human-in-the-loop qualitative coding with Streamlit, Ollama, and SQLite."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  # Streamlit 1.61.0's released lock uses Starlette 1.3.1. Starlette 1.4
  # changed GZipResponder.__init__ incompatibly while remaining inside
  # Streamlit's published dependency range, causing every HTTP request to fail.
  "streamlit==1.61.0",
  "starlette==1.3.1",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hitl_qualitative*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "upstream_compat: requires a configured checkout of the upstream DPO repository",
  "real_data_compat: requires the real preference-pair JSONL file",
]
